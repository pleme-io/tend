name: docker-image

# skip-shell-budget: parked Pillar-8 violation with no consumer — this file's
# own retirement note (below) records both reasons, and porting 26 lines of
# Dockerfile heredoc to the Nix image path would build an artifact that the
# same note says nothing pulls. Waived rather than counted so the fleet shell
# ratchet can reach zero honestly; DELETE THIS WAIVER, not the reasons, if the
# image ever acquires a consumer.

# PUSH TRIGGER RETIRED 2026-07-31 — still runnable on demand, never on merge.
#
# Three independent reasons, any one sufficient:
#
#   1. NOBODY CONSUMES IT. A zoekt sweep for `ghcr.io/pleme-io/tend` across the
#      org finds exactly two hits — a skill doc and a test fixture. No chart, no
#      CR, no manifest pulls this image. It has been building an artifact with
#      no reader.
#   2. IT VIOLATES PILLAR 8. This builds a Dockerfile through
#      docker/build-push-action against a generated `docker-context`. The fleet
#      rule is Nix `dockerTools` only, no Dockerfiles — and tend's flake exposes
#      no `dockerImage` attr to feed the substrate shim, so porting it is real
#      work, not a rename.
#   3. IT IS METERED. `runs-on: ubuntu-24.04` is hardcoded, so on a PRIVATE repo
#      it burns GitHub-hosted minutes. The fleet pattern is a 5-line shim over
#      `pleme-io/substrate/.github/workflows/image-push.yml`, whose own
#      `runs-on` ternary routes private repos to camelot's unmetered
#      `camelot-builder-pleme-eks` pool. `auto-release.yml` in this same repo
#      already does the right thing via `cargo-auto-release.yml`.
#
# MODULARIZE, DON'T DELETE: `workflow_dispatch` stays, so this is one manual run
# away if it is ever needed. THE DESTINATION if a real consumer appears is the
# substrate shim (add a `dockerImage` attr to the flake, call `image-push.yml`)
# — not a revival of the Dockerfile path, which would re-import all three
# problems above.
on:
  workflow_dispatch: {}

jobs:
  build-and-push:
    name: Build + push ghcr.io/pleme-io/tend (linux/amd64)
    # Private repo -> Camelot self-hosted; public -> free GitHub-hosted.
    # A metered GitHub-hosted runner on a private repo exhausted the
    # org's Actions spending limit on 2026-08-08 and blocked every
    # private pleme-io repo. See pleme-io/actions/runner-resolve.
    runs-on: ${{ github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (commit SHA prefix)
        id: tag
        run: echo "tag=amd64-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: pleme-io/actions/registry-login@main
        with:
          registry: ghcr.io
          client: docker
          username: ${{ github.actor }}
          bot-pat: ${{ secrets.BOT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build tend binary (linux/amd64, with operator feature)
        run: cargo build --release --features operator --bin tend

      - name: Stage Dockerfile context
        run: |
          mkdir -p docker-context
          cp target/release/tend docker-context/tend
          cat > docker-context/Dockerfile <<'EOF'
          FROM debian:bookworm-slim
          LABEL org.opencontainers.image.source=https://github.com/pleme-io/tend
          LABEL org.opencontainers.image.description="tend operator + throttle worker"
          LABEL org.opencontainers.image.licenses=MIT
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates \
                git \
                openssh-client \
                tini \
                xz-utils \
                bzip2 \
                && rm -rf /var/lib/apt/lists/*
          # Install Nix (single-user) into /nix so `tend operator`'s apply path
          # can shell out to nix-flake-check and nix-build inside the container.
          RUN mkdir -m 0755 /nix && groupadd -g 1000 tend \
                && useradd -u 1000 -g 1000 -m -d /home/tend -s /bin/bash tend \
                && chown -R tend:tend /nix /home/tend
          USER tend
          ENV USER=tend HOME=/home/tend XDG_CACHE_HOME=/home/tend/.cache
          ENV NIX_CONFIG="experimental-features = nix-command flakes"
          WORKDIR /var/lib/tend-workspace
          COPY --chown=tend:tend tend /usr/local/bin/tend
          ENTRYPOINT ["/usr/bin/tini", "--", "/usr/local/bin/tend"]
          CMD ["operator"]
          EOF

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pleme-io/tend:${{ steps.tag.outputs.tag }}
            ghcr.io/pleme-io/tend:amd64-latest

      - name: Image tag echo
        run: echo "Pushed ghcr.io/pleme-io/tend:${{ steps.tag.outputs.tag }}"
