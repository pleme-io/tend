name: docker-image

# Per pleme-io's CONSTRUCTIVE-ACTIONS pattern, the buildx + push surface
# is owned by the typed `pleme-io/docker-build-push` action (arch-synthesizer
# action_domain fixture `docker_build_push`). This workflow does only the
# tend-specific staging (cargo build + Dockerfile context assembly) and
# hands the resulting context to the typed action.
#
# Source of truth for the action: arch-synthesizer/src/action_domain/fixtures.rs
# Per-action repo: https://github.com/pleme-io/docker-build-push (v1)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    name: Build + push ghcr.io/pleme-io/tend (linux/amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags (commit SHA prefix)
        id: tag
        run: |
          short=$(git rev-parse --short HEAD)
          echo "tags=amd64-$short,amd64-latest" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build tend binary (linux/amd64, with operator feature)
        run: cargo build --release --features operator --bin tend

      - name: Stage Dockerfile context
        run: |
          mkdir -p docker-context
          cp target/release/tend docker-context/tend
          cat > docker-context/Dockerfile <<'EOF'
          FROM debian:bookworm-slim
          LABEL org.opencontainers.image.source=https://github.com/pleme-io/tend
          LABEL org.opencontainers.image.description="tend operator + throttle worker"
          LABEL org.opencontainers.image.licenses=MIT
          RUN apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates \
                git \
                openssh-client \
                tini \
                xz-utils \
                bzip2 \
                && rm -rf /var/lib/apt/lists/*
          # Install Nix (single-user) into /nix so `tend operator`'s apply path
          # can shell out to nix-flake-check and nix-build inside the container.
          RUN mkdir -m 0755 /nix && groupadd -g 1000 tend \
                && useradd -u 1000 -g 1000 -m -d /home/tend -s /bin/bash tend \
                && chown -R tend:tend /nix /home/tend
          USER tend
          ENV USER=tend HOME=/home/tend XDG_CACHE_HOME=/home/tend/.cache
          ENV NIX_CONFIG="experimental-features = nix-command flakes"
          WORKDIR /var/lib/tend-workspace
          COPY --chown=tend:tend tend /usr/local/bin/tend
          ENTRYPOINT ["/usr/bin/tini", "--", "/usr/local/bin/tend"]
          CMD ["operator"]
          EOF

      - uses: pleme-io/docker-build-push@v1
        with:
          image: ghcr.io/pleme-io/tend
          tags: ${{ steps.tag.outputs.tags }}
          platforms: linux/amd64
          context: docker-context
