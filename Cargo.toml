[package]
name = "pleme-tend"
version = "0.3.0"
edition = "2021"
description = "Workspace repository manager — keeps your repos in sync"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
repository = "https://github.com/pleme-io/tend"
homepage = "https://github.com/pleme-io/tend"
keywords = ["workspace", "repository", "git", "sync", "monorepo"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "tend"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
anyhow = "1.0"
thiserror = "2.0"
colored = "2.1"
dirs = "6.0"
shellexpand = "3.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
todoku = { git = "https://github.com/pleme-io/todoku" }
shigoto-dag = { git = "https://github.com/pleme-io/shigoto" }
shigoto-types = { git = "https://github.com/pleme-io/shigoto" }
shigoto-scheduler = { git = "https://github.com/pleme-io/shigoto" }
shigoto-emit = { git = "https://github.com/pleme-io/shigoto" }
shigoto-gate = { git = "https://github.com/pleme-io/shigoto" }
shigoto-retry = { git = "https://github.com/pleme-io/shigoto" }
shigoto-budget = { git = "https://github.com/pleme-io/shigoto" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
async-trait = "0.1"
# `notify` matches the version shikumi pulls in, so the daemon's
# hot-reload watcher can pattern-match on EventKind without a
# duplicate crate version.
notify = "8.2"
shikumi = { git = "https://github.com/pleme-io/shikumi", features = ["cli"] }
tsunagu = { git = "https://github.com/pleme-io/tsunagu" }
opencode-zen = { git = "https://github.com/pleme-io/opencode-zen" }
cron = "0.15"

kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_31"], optional = true }
schemars = { version = "0.8", features = ["chrono"], optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
petgraph = { version = "0.6", optional = true }
# Pure-Rust Nix language parser (rowan-based CST). Used for read-only
# validation of `flake.nix`: confirm proposed inputs exist in the user's
# declared inputs block, surface drift between flake.nix and flake.lock.
# No subprocess to nix, no C deps.
rnix = { version = "0.11", optional = true }
rowan = { version = "0.15", optional = true }
# Pure-Rust RNG for jittered requeue intervals — eliminates the
# cron-shaped polling pattern that GitHub's abuse detector flags.
rand = { version = "0.8", optional = true }
prometheus = { version = "0.13", default-features = false, optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
# samba — typed rate-limited consumer primitive. Provides UpstreamApi
# trait + LeakyBucket + JetStreamPullWorker. The `tend throttle`
# subcommand instantiates these around tend's existing GitHub client.
samba = { git = "https://github.com/pleme-io/samba", optional = true }
# async-nats for the operator-side NatsThrottleClient that publishes
# refresh jobs + awaits results when TEND_THROTTLE_ENABLED=true.
async-nats = { version = "0.38", optional = true }
uuid = { version = "1.10", features = ["v4"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# `operator` is default — tend ships as a single binary covering both
# the CLI (sync/watch/daemon/...) AND the K8s controller (`tend operator`).
# CLI-only users pay ~6MB binary size for kube-rs + k8s-openapi but get
# a unified deliverable; operators pay no plumbing cost. Disable with
# `--no-default-features` for a lean CLI build.
default = ["operator"]
operator = [
    "dep:kube",
    "dep:k8s-openapi",
    "dep:schemars",
    "dep:futures",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:petgraph",
    "dep:rnix",
    "dep:rowan",
    "dep:rand",
    "dep:prometheus",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:samba",
    "dep:async-nats",
    "dep:uuid",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
