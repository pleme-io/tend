[package]
resolver = "3"
# ── ★ MSRV IS ENFORCED, NOT DECORATIVE ──────────────────────────────────
# `rust-version` alone does NOTHING under resolver 2 (the edition-2021
# default): cargo ignores it when selecting dependency versions. Both lines
# are required, and resolver 3 is the half that binds.
#
# MEASURED 2026-08-05/06: `kstring@2.0.4` (requires rustc 1.96.0) entered
# codesearch's lockfile, and because codesearch is in every node's
# home-manager closure it stopped the ENTIRE fleet rebuilding — rio sat on a
# stale generation for six hours. It was pinned back with `cargo update
# --precise`, and the very next release regenerated the lock and REVERTED the
# pin. A lockfile pin cannot survive its own release automation; a declaration
# constrains resolution instead of recording its result.
#
# CORRECTED 2026-08-06 — the sentence that used to sit here, "1.95.0 is the
# fleet toolchain", was WRONG WHEN WRITTEN and wrong by two minor versions. It
# was inherited from the incident write-up rather than measured. The fleet's
# `fenix` input is the literal string `stable` (substrate lib/build/rust/
# overlay.nix), so the compiler is whatever the locked fenix rev's channel says
# — today rev d17fa5c0, channel dated 2026-07-16, `rustc 1.97.1`, verified by
# executing the built toolchain, not by reading a lockfile.
#
# So this declaration was never the floor it claimed to be: it was a CEILING
# two minors BELOW the compiler. Under resolver 3 cargo refuses any crate whose
# rust-version exceeds the DECLARED one, so we were locked out of every 1.96+
# and 1.97+ crate while running a compiler that compiles them fine. The
# mitigation outlived the condition it mitigated.
#
# 1.97.0, not 1.97.1, deliberately: one patch of headroom means a fenix rev
# that lags by a patch cannot re-create the exact "dep needs more than our
# rustc" failure this block exists to prevent. The compiler floats with no gate
# — it moved 1.96.0 -> 1.97.0 -> 1.97.1 on routine `nix flake update` commits,
# unannounced, with no attributable breakage — so the declaration must tolerate
# it moving under us.
rust-version = "1.97.0"
name = "pleme-tend"
version = "0.3.12"
edition = "2021"
description = "Workspace repository manager — keeps your repos in sync"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
repository = "https://github.com/pleme-io/tend"
homepage = "https://github.com/pleme-io/tend"
keywords = ["workspace", "repository", "git", "sync", "monorepo"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[[bin]]
name = "tend"
path = "src/main.rs"

[dependencies]
regex = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# Kanshou — live process introspection. tend daemons run continuously
# and were the canonical "what is it doing right now?" archaeology
# pain point. With kanshou, operators query `gen kanshou query tend
# <field>` for the live state.
kanshou = { git = "https://github.com/pleme-io/kanshou" }
parking_lot = "0.12"
serde_yaml_ng = "0.10"
anyhow = "1.0"
thiserror = "2.0"
# Rust crate-metadata extraction for the darwin reproducibility gate
# (prebuild_cache.rs). Default features already carry `archive` (ar member
# parsing, for an .rlib's `lib.rmeta`) + `macho` (section lookup, for a
# proc-macro .dylib's `.rustc`). Same crate rustc itself uses for this job.
object = "0.36"
colored = "2.1"
dirs = "6.0"
shellexpand = "3.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
# MCP transport. Same version + features as tear/mado, so the fleet's servers
# stay on one rmcp rather than drifting per tool.
rmcp = { version = "1.4", features = ["server", "transport-io"] }
base64 = "0.22"
todoku = { git = "https://github.com/pleme-io/todoku" }
shigoto-dag = { git = "https://github.com/pleme-io/shigoto" }
shigoto-types = { git = "https://github.com/pleme-io/shigoto" }
shigoto-scheduler = { git = "https://github.com/pleme-io/shigoto" }
shigoto-emit = { git = "https://github.com/pleme-io/shigoto" }
shigoto-gate = { git = "https://github.com/pleme-io/shigoto" }
shigoto-retry = { git = "https://github.com/pleme-io/shigoto" }
shigoto-budget = { git = "https://github.com/pleme-io/shigoto" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
async-trait = "0.1"
# `notify` matches the version shikumi pulls in, so the daemon's
# hot-reload watcher can pattern-match on EventKind without a
# duplicate crate version.
notify = "8.2"
shikumi = { git = "https://github.com/pleme-io/shikumi", features = ["cli"] }
tsunagu = { git = "https://github.com/pleme-io/tsunagu" }
opencode-zen = { git = "https://github.com/pleme-io/opencode-zen" }
cron = "0.15"

kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_31"], optional = true }
schemars = { version = "0.8", features = ["chrono"], optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
petgraph = { version = "0.6", optional = true }
# Pure-Rust Nix language parser (rowan-based CST). Used for read-only
# validation of `flake.nix`: confirm proposed inputs exist in the user's
# declared inputs block, surface drift between flake.nix and flake.lock.
# No subprocess to nix, no C deps.
rnix = { version = "0.11", optional = true }
rowan = { version = "0.15", optional = true }
# Pure-Rust RNG for jittered requeue intervals — eliminates the
# cron-shaped polling pattern that GitHub's abuse detector flags.
rand = { version = "0.8", optional = true }
# 0.14 drops the protobuf 2.x dependency chain. 0.13 pinned
# protobuf 2.28.0, which carries RUSTSEC "Crash due to uncontrolled
# recursion in protobuf crate" (fixed >=3.7.2).
prometheus = { version = "0.14", default-features = false, optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
# samba — typed rate-limited consumer primitive. Provides UpstreamApi
# trait + LeakyBucket + JetStreamPullWorker. The `tend throttle`
# subcommand instantiates these around tend's existing GitHub client.
samba = { git = "https://github.com/pleme-io/samba", optional = true }
# async-nats for the operator-side NatsThrottleClient that publishes
# refresh jobs + awaits results when TEND_THROTTLE_ENABLED=true.
# 0.38 pinned rustls-webpki 0.102.8, which carries FOUR advisories —
# three of them certificate-validation bypasses (name constraints
# incorrectly accepted for URI names and for wildcard names; CRLs not
# treated as authoritative by distribution point) plus a reachable panic
# in CRL parsing. tend makes continuous HTTPS calls to GitHub, so a
# name-constraint bypass is squarely on its trust path.
async-nats = { version = "0.50", optional = true }
uuid = { version = "1.10", features = ["v4"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# `operator` is default — tend ships as a single binary covering both
# the CLI (sync/watch/daemon/...) AND the K8s controller (`tend operator`).
# CLI-only users pay ~6MB binary size for kube-rs + k8s-openapi but get
# a unified deliverable; operators pay no plumbing cost. Disable with
# `--no-default-features` for a lean CLI build.
default = ["operator"]
operator = [
    "dep:kube",
    "dep:k8s-openapi",
    "dep:schemars",
    "dep:futures",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:petgraph",
    "dep:rnix",
    "dep:rowan",
    "dep:rand",
    "dep:prometheus",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:samba",
    "dep:async-nats",
    "dep:uuid",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
